schema_version: '2.0'
title: Roblitz2013 Menstrual Cycle GnRH Analogue Lab Visualisation
description: Dedicated presentation model for Roblitz2013 Menstrual Cycle GnRH Analogue
  Lab.
standard: other
tags:
- development
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.development_visualisation:DevelopmentVisualisationModel
  init_kwargs:
    integration_step: 1.0
    lab_title: Roblitz2013 Menstrual Cycle GnRH Analogue Lab
    question: What endocrine and follicular states dominate the simulated GnRH analogue
      run?
    answer_focus: The answer compares GnRH, FSH, LH, estradiol, progesterone, inhibins,
      ovulatory follicle, and luteal stages.
    caveat: Kept because follicular development is explicit; runtime stays below the
      long-horizon solver instability observed near later model time.
    observables:
    - source_id: GnRH
      port: gonadotropin_releasing_hormone
      label: GnRH
      group: hormone
    - source_id: FSH_bld
      port: follicle_stimulating_hormone_blood
      label: Blood FSH
      group: hormone
    - source_id: LH_bld
      port: luteinizing_hormone_blood
      label: Blood LH
      group: hormone
    - source_id: E2
      port: estradiol
      label: Estradiol
      group: hormone
    - source_id: P4
      port: progesterone
      label: Progesterone
      group: hormone
    - source_id: InhA
      port: inhibin_a
      label: Inhibin A
      group: hormone
    - source_id: InhB
      port: inhibin_b
      label: Inhibin B
      group: hormone
    - source_id: OvF
      port: ovulatory_follicle
      label: Ovulatory follicle
      group: follicle
    - source_id: Lut1
      port: luteal_stage_one
      label: Luteal stage 1
      group: luteal
    - source_id: Lut4
      port: luteal_stage_four
      label: Luteal stage 4
      group: luteal
    - source_id: Ago_c
      port: gonadotropin_releasing_hormone_agonist_central
      label: GnRH agonist central
      group: drug
    - source_id: Ant_c
      port: gonadotropin_releasing_hormone_antagonist_central
      label: GnRH antagonist central
      group: drug
    phase:
      x: estradiol
      y: progesterone
      x_label: Estradiol
      y_label: Progesterone
      title: Estradiol vs Progesterone
  communication_step: 1.0
runtime:
  dependencies:
    packages: []
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: core_state
    description: Current friendly observable values from the core model.
    schema:
      gonadotropin_releasing_hormone: float
      follicle_stimulating_hormone_blood: float
      luteinizing_hormone_blood: float
      estradiol: float
      progesterone: float
      inhibin_a: float
      inhibin_b: float
      ovulatory_follicle: float
      luteal_stage_one: float
      luteal_stage_four: float
      gonadotropin_releasing_hormone_agonist_central: float
      gonadotropin_releasing_hormone_antagonist_central: float
  - name: core_summary
    description: Core model run summary.
    schema:
      duration_simulated: float
      observable_count: int
      largest_change_observable: str
      largest_change_magnitude: float
      peak_observable: str
      peak_value: float
  - name: core_species_labels
    description: Human-readable labels for core observables.
    schema:
      gonadotropin_releasing_hormone: str
      follicle_stimulating_hormone_blood: str
      luteinizing_hormone_blood: str
      estradiol: str
      progesterone: str
      inhibin_a: str
      inhibin_b: str
      ovulatory_follicle: str
      luteal_stage_one: str
      luteal_stage_four: str
      gonadotropin_releasing_hormone_agonist_central: str
      gonadotropin_releasing_hormone_antagonist_central: str
  outputs: []
