schema_version: '2.0'
title: Schittler2010 Progenitor Cell Fate Lab Visualisation
description: Dedicated presentation model for Schittler2010 Progenitor Cell Fate Lab.
standard: other
tags:
- development
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.development_visualisation:DevelopmentVisualisationModel
  init_kwargs:
    integration_step: 1.0
    lab_title: Schittler2010 Progenitor Cell Fate Lab
    question: Which progenitor-cell fate dominates the simulated run?
    answer_focus: The answer compares progenitor, osteoblast, and chondrocyte compartments.
    caveat: Ambiguous z parameters are not exposed as public inputs.
    observables:
    - source_id: P
      port: progenitor_cells
      label: Progenitor cells
      group: fate
    - source_id: O
      port: osteoblast_cells
      label: Osteoblast cells
      group: fate
    - source_id: C
      port: chondrocyte_cells
      label: Chondrocyte cells
      group: fate
    phase:
      x: osteoblast_cells
      y: chondrocyte_cells
      x_label: Osteoblast cells
      y_label: Chondrocyte cells
      title: Osteoblast cells vs Chondrocyte cells
  communication_step: 1.0
runtime:
  dependencies:
    packages: []
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: core_state
    description: Current friendly observable values from the core model.
    schema:
      progenitor_cells: float
      osteoblast_cells: float
      chondrocyte_cells: float
  - name: core_summary
    description: Core model run summary.
    schema:
      duration_simulated: float
      observable_count: int
      largest_change_observable: str
      largest_change_magnitude: float
      peak_observable: str
      peak_value: float
  - name: core_species_labels
    description: Human-readable labels for core observables.
    schema:
      progenitor_cells: str
      osteoblast_cells: str
      chondrocyte_cells: str
  outputs: []
