schema_version: '2.0'
title: Calzone2007 Drosophila Embryo Cell Cycle Lab Visualisation
description: Dedicated presentation model for Calzone2007 Drosophila Embryo Cell Cycle
  Lab.
standard: other
tags:
- development
- visualisation
authors:
- Biosimulant Team
biosim:
  entrypoint: src.development_visualisation:DevelopmentVisualisationModel
  init_kwargs:
    integration_step: 1.0
    lab_title: Calzone2007 Drosophila Embryo Cell Cycle Lab
    question: Do mitotic-control variables produce embryo cell-cycle oscillatory activity?
    answer_focus: Mitotic-control activity is evaluated from maturation-promoting
      factor, String phosphatase, Wee1 kinase, cyclin B, and nuclear division state
      excursions.
    caveat: No intervention input is exposed because the source has no clear external
      stimulus parameter; values are native SBML quantities.
    observables:
    - source_id: MPFc
      port: cytoplasmic_maturation_promoting_factor
      label: Cytoplasmic MPF
      group: maturation_promoting_factor
    - source_id: MPFn
      port: nuclear_maturation_promoting_factor
      label: Nuclear MPF
      group: maturation_promoting_factor
    - source_id: StgPc
      port: cytoplasmic_string_phosphatase
      label: Cytoplasmic String phosphatase
      group: string
    - source_id: Stgc
      port: cytoplasmic_string_protein
      label: Cytoplasmic String protein
      group: string
    - source_id: Wee1c
      port: cytoplasmic_wee_one_kinase
      label: Cytoplasmic Wee1 kinase
      group: wee_one_kinase
    - source_id: Wee1n
      port: nuclear_wee_one_kinase
      label: Nuclear Wee1 kinase
      group: wee_one_kinase
    - source_id: CycBT
      port: total_cyclin_b
      label: Total cyclin B
      group: cyclin
    - source_id: N
      port: nuclear_division_state
      label: Nuclear division state
      group: division
    phase:
      x: cytoplasmic_maturation_promoting_factor
      y: nuclear_maturation_promoting_factor
      x_label: Cytoplasmic MPF
      y_label: Nuclear MPF
      title: Cytoplasmic MPF vs Nuclear MPF
  communication_step: 1.0
runtime:
  dependencies:
    packages: []
parameters:
- name: integration_step
  value: 1.0
  min: 0.0
  units: model_time
  description: Sampling step for the visualisation model.
io:
  inputs:
  - name: core_state
    description: Current friendly observable values from the core model.
    schema:
      cytoplasmic_maturation_promoting_factor: float
      nuclear_maturation_promoting_factor: float
      cytoplasmic_string_phosphatase: float
      cytoplasmic_string_protein: float
      cytoplasmic_wee_one_kinase: float
      nuclear_wee_one_kinase: float
      total_cyclin_b: float
      nuclear_division_state: float
  - name: core_summary
    description: Core model run summary.
    schema:
      duration_simulated: float
      observable_count: int
      largest_change_observable: str
      largest_change_magnitude: float
      peak_observable: str
      peak_value: float
  - name: core_species_labels
    description: Human-readable labels for core observables.
    schema:
      cytoplasmic_maturation_promoting_factor: str
      nuclear_maturation_promoting_factor: str
      cytoplasmic_string_phosphatase: str
      cytoplasmic_string_protein: str
      cytoplasmic_wee_one_kinase: str
      nuclear_wee_one_kinase: str
      total_cyclin_b: str
      nuclear_division_state: str
  outputs: []
