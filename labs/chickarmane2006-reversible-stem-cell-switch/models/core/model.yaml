schema_version: '2.0'
title: Chickarmane2006 reversible stem-cell switch SBML model
description: Reversible embryonic stem-cell transcriptional switch executed directly from
  the bundled SBML source.
standard: sbml
tags:
- development
- sbml
- tellurium
- faithful
authors:
- Biosimulant Team
- Vijay Chickarmane
- Carl Troein
- Ulrike A Nuber
- Herbert M Sauro
- Carsten Peterson
upstream:
  id: biomodels_ebi:BIOMD0000000203
  source_db: biomodels_ebi
  source_id: BIOMD0000000203
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/BIOMD0000000203
  download_url: https://www.ebi.ac.uk/biomodels/model/download/BIOMD0000000203?filename=BIOMD0000000203_url.xml
  license: CC0
biosim:
  entrypoint: src.chickarmane2006_stem_cell_switch_reversible_biomd0000000203_model:Chickarmane2006StemCellSwitchReversibleBiomd0000000203Model
  init_kwargs:
    model_path: data/BIOMD0000000203.xml
    integration_step: 0.1
  communication_step: 1.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
parameters:
- name: integration_step
  value: 0.1
  min: 0.0
  units: model_time
  description: Internal Tellurium sampling step.
io:
  inputs:
  - name: p53_signal
    maps_to: p53
    label: p53 signal
    default: 0.0
    units: native SBML value
    description: Sets the fixed p53 boundary signal used by the stem-cell switch reactions.
      Maps to SBML symbol `p53`.
  outputs:
  - name: octamer_binding_transcription_factor_4
    maps_to: OCT4
    label: OCT4
    description: OCT4. Maps to SBML symbol `OCT4`.
  - name: sry_box_transcription_factor_2
    maps_to: SOX2
    label: SOX2
    description: SOX2. Maps to SBML symbol `SOX2`.
  - name: nanog_homeobox
    maps_to: NANOG
    label: NANOG
    description: NANOG. Maps to SBML symbol `NANOG`.
  - name: octamer_binding_transcription_factor_4_sry_box_transcription_factor_2_complex
    maps_to: OCT4_SOX2
    label: OCT4-SOX2 complex
    description: OCT4-SOX2 complex. Maps to SBML symbol `OCT4_SOX2`.
  - name: differentiation_protein
    maps_to: Protein
    label: Differentiation protein
    description: Differentiation protein. Maps to SBML symbol `Protein`.
  - name: state
    description: Full friendly observable record for reproducibility and downstream visualisation.
      Raw SBML symbols remain traceable through maps_to and wrapper metadata.
  - name: summary
    description: Largest-change and peak summary across the simulated friendly observables.
  - name: species_labels
    description: Mapping from friendly observable keys to display labels.
